<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>예약 · 문의 | ICARE Pilates</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .sub {
        background: #f3f0eb;
        min-height: 100vh;
        color: #19231f;
      }
      .sub-head {
        padding: 28px 5vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sub-head a {
        color: inherit;
        text-decoration: none;
        font: 12px "DM Mono";
      }
      .sub-main {
        max-width: 1220px;
        margin: auto;
        padding: 85px 5vw 120px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10vw;
      }
      .sub h1 {
        font: 400 clamp(58px, 7vw, 108px)/0.92 Pretendard;
        letter-spacing: -0.06em;
        margin: 0 0 30px;
      }
      .sub-intro {
        font-size: 17px;
        line-height: 1.8;
      }
      .contact-buttons {
        display: flex;
        gap: 10px;
        margin-top: 45px;
      }
      .contact-buttons a {
        padding: 15px 18px;
        background: #19231f;
        color: #fff;
        text-decoration: none;
        font-size: 13px;
      }
      .contact-buttons a:last-child {
        background: #f5dd57;
        color: #19231f;
      }
      .inquiry-form {
        padding-top: 15px;
      }
      .inquiry-form label {
        display: grid;
        gap: 9px;
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 23px;
      }
      .inquiry-form input,
      .inquiry-form select,
      .inquiry-form textarea {
        border: 0;
        border-bottom: 1px solid #19231f66;
        background: transparent;
        padding: 12px 0;
        font: 16px Pretendard;
        outline: 0;
      }
      .inquiry-form textarea {
        height: 105px;
        resize: vertical;
      }
      .inquiry-form button {
        background: #19231f;
        color: white;
        border: 0;
        padding: 16px 22px;
        font: 12px "DM Mono";
        cursor: pointer;
      }
      .inquiry-form button:disabled { opacity: .55; cursor: wait; }
      .confirm-dialog { width: min(510px, calc(100vw - 36px)); padding: 0; border: 0; background: #f3f0eb; color: #19231f; box-shadow: 0 30px 80px #0005; }
      .confirm-dialog::backdrop { background: rgb(25 35 31 / .62); }
      .confirm-inner { padding: 48px; }
      .confirm-inner h2 { margin: 12px 0 17px; font: 400 32px/1.15 Pretendard; letter-spacing: -.04em; }
      .confirm-inner p { font-size: 15px; line-height: 1.75; color: #526058; }
      .phone-card { display: flex; align-items: center; justify-content: space-between; margin: 28px 0; padding: 17px 0; border-top: 1px solid #19231f; border-bottom: 1px solid #19231f; }
      .phone-card span { font-size: 12px; }.phone-card a { color: inherit; text-decoration: none; font: 18px 'DM Mono'; }
      .dialog-actions { display: flex; gap: 9px; margin-top: 34px; }.dialog-actions button { border: 0; padding: 15px 18px; background: #19231f; color: white; font: 12px 'DM Mono'; cursor: pointer; }.dialog-actions .cancel { background: transparent; color: #19231f; border: 1px solid #19231f55; }
      .board {
        max-width: 1220px;
        margin: auto;
        padding: 0 5vw 100px;
      }
      .board-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        border-bottom: 1px solid #19231f;
      }
      .board h2 {
        font-size: 32px;
        letter-spacing: -0.04em;
      }
      .board p {
        font-size: 13px;
      }
      .faq {
        border-bottom: 1px solid #19231f2e;
      }
      .faq summary {
        display: grid;
        grid-template-columns: 70px 1fr 22px;
        gap: 20px;
        align-items: center;
        cursor: pointer;
        list-style: none;
        padding: 24px 0;
        font-size: 16px;
        font-weight: 600;
      }
      .faq summary::-webkit-details-marker {
        display: none;
      }
      .faq summary:after {
        content: "+";
        font-size: 22px;
        font-weight: 400;
        text-align: right;
      }
      .faq[open] summary:after {
        content: "−";
      }
      .faq small {
        font: 11px "DM Mono";
        color: #68756e;
      }
      .faq-answer {
        margin: 0 0 25px 90px;
        max-width: 650px;
        font-size: 15px;
        line-height: 1.85;
        color: #4b554f;
      }
      @media (max-width: 700px) {
        .sub-main {
          display: block;
          padding-top: 50px;
        }
        .inquiry-form {
          margin-top: 60px;
        }
        .faq summary {
          grid-template-columns: 35px 1fr 22px;
          gap: 10px;
          font-size: 15px;
        }
        .faq-answer {
          margin-left: 45px;
          font-size: 14px;
        }
      }
    </style>
    <link rel="stylesheet" href="/client.css" />
    <style>
      .inquiry-note { margin-top: 12px; color: #625d51; font-size: 14px; }
    </style>
  </head>
  <body class="sub">
    <header class="sub-head">
      <a class="logo" href="index.html"
        >I<span>CARE</span><small>KIDS & FAMILY PILATES</small></a
      ><a href="index.html">← HOME</a>
    </header>
    <main>
      <section class="sub-main">
        <div>
          <p class="section-label">온라인 상담 신청</p>
          <h1>레슨 상담</h1>
          <p class="sub-intro">
            관심 있는 레슨과 희망 시간을 알려주세요.
          </p>
          <div class="contact-buttons">
            <a href="tel:01048692479" data-kakao>전화 상담</a
            ><a
              href="https://naver.me/GXFVllY5"
              target="_blank"
              rel="noreferrer"
              >N 네이버 플레이스</a
            >
          </div>
        </div>
        <form class="inquiry-form" id="form" method="post">
          <label>성함 · 키즈 상담은 보호자 성함<input name="name" autocomplete="name" maxlength="60" required /></label
          ><label>연락처<input name="phone" type="tel" autocomplete="tel" placeholder="010-0000-0000" maxlength="25" required /></label
          ><label
            >관심 프로그램<select name="program">
              <option>1:1 Private</option>
              <option>2:1 Duet</option>
              <option>3:1 Group</option>
              <option>아이케어 키즈 필라테스</option>
              <option>임산부·산후 운동</option>
              <option>시니어 운동</option>
              <option>슈로스 특화운동</option>
              <option>골프 컨디셔닝</option>
              <option>산후·통증 케어</option>
            </select></label
          ><label
            >문의 내용<textarea
              name="message" maxlength="500" placeholder="희망 요일이나 시간을 적어 주세요." required
            ></textarea></label
          ><button type="submit" disabled>메일 앱 열기</button>
          <p class="inquiry-note">메일 앱에 작성 내용이 채워집니다. 내용을 확인한 뒤 앱에서 보내 주세요. <a href="mailto:icarepilates@naver.com">icarepilates@naver.com</a></p>
          <p class="inquiry-note" id="mail-status" role="status"></p>
        </form>
      </section>
      <section class="board">
        <div class="board-head">
          <h2>자주 묻는 질문</h2>
        </div>
        <div data-faq></div>
      </section>
    </main>
    <script type="module" src="/inquiry.js"></script>
  </body>
</html>
