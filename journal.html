<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal | ICARE Pilates</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;background:#f3f0eb;color:#19231f}.j-head{padding:28px 5vw;display:flex;justify-content:space-between;align-items:center}.j-head a{color:inherit;text-decoration:none;font:12px 'DM Mono'}.journal-article{max-width:920px;margin:auto;padding:85px 5vw 130px}.journal-article h1{font:400 clamp(45px,6vw,82px)/1.05 Pretendard;letter-spacing:-.06em;margin:18px 0 35px}.meta{font:12px 'DM Mono';color:#66716b}.journal-article>img{width:100%;height:500px;object-fit:cover;margin:50px 0 55px;filter:saturate(.76)}.body-copy{max-width:660px;margin:auto}.body-copy p{font-size:17px;line-height:2;margin:0 0 25px}.body-copy h2{font-size:25px;letter-spacing:-.04em;margin:55px 0 18px}.related{margin-top:75px;padding-top:25px;border-top:1px solid #19231f}.related a{display:block;color:inherit;text-decoration:none;padding:15px 0;border-bottom:1px solid #19231f2e;font-size:15px}@media(max-width:700px){.journal-article{padding-top:48px}.journal-article h1{font-size:46px}.journal-article>img{height:350px;margin:35px 0}.body-copy p{font-size:16px;line-height:1.9}}</style></head><body><header class="j-head"><a class="logo" href="index.html">I<span>CARE</span><small>KIDS & FAMILY PILATES</small></a><a href="index.html#journal">← JOURNAL</a></header><main class="journal-article" id="article"></main><script>const a={posture:{tag:'KIDS CARE',date:'2026.08.18',title:'아이의 바른 자세,\n언제부터 살펴볼까요?',img:'https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1600&q=88',lead:'자세는 한 번에 완성되는 모양이 아니라, 매일 몸을 사용하는 방식에서 자연스럽게 만들어집니다.',body:['성장기에는 키가 빠르게 자라고 몸의 비율도 계속 변합니다. 이 시기에는 바르게 앉으라고 반복해서 말하기보다, 아이가 스스로 몸의 중심을 느끼고 편안하게 움직일 기회를 만드는 것이 중요합니다.','ICARE의 어린이 필라테스는 척추를 곧게 세우는 것만 목표로 하지 않습니다. 발의 지지, 골반의 균형, 호흡과 시선까지 연결해 아이가 자기 몸의 신호를 알아차리도록 돕습니다.']},golf:{tag:'GOLF',date:'2026.08.03',title:'골프 스윙을 편안하게 만드는\n코어의 힘',img:'https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=1600&q=88',lead:'더 멀리 보내는 힘보다, 흔들리지 않는 중심이 먼저입니다.',body:['스윙은 한 번의 강한 동작처럼 보이지만 발에서 시작한 힘이 몸통을 거쳐 팔로 전달되는 섬세한 연결입니다. 코어가 안정적일수록 회전은 더 부드럽고 일관되게 이어집니다.','필라테스는 회전 자체보다 회전할 때 몸을 지지하는 방법을 다룹니다. 흉추와 고관절의 가동성을 열고, 골반과 갈비뼈가 흔들리지 않도록 만드는 연습이 스윙의 질을 바꿉니다.']},postpartum:{tag:"WOMEN'S CARE",date:'2026.07.22',title:'산후 회복,\n내 몸의 속도를 찾는 시간',img:'https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=1600&q=88',lead:'회복은 이전의 몸으로 돌아가는 일이 아니라, 달라진 나를 다시 만나는 과정입니다.',body:['출산 후의 몸은 많은 변화를 겪습니다. 회복의 속도는 모두 다르기 때문에, 남과 비교하기보다 호흡과 작은 움직임으로 내 몸의 반응을 확인하는 시간이 필요합니다.','ICARE는 골반저근과 복부의 연결, 척추의 편안한 움직임을 차분하게 회복해 나갑니다. 무리하지 않는 꾸준함이 일상에 다시 힘을 더합니다.']}};const x=a[new URLSearchParams(location.search).get('article')]||a.posture;document.title=x.title.replaceAll('\n',' ')+' | ICARE';document.querySelector('#article').innerHTML=`<p class="eyebrow">${x.tag}</p><p class="meta">${x.date}</p><h1>${x.title.replaceAll('\n','<br>')}</h1><img src="${x.img}" alt="${x.title}"><div class="body-copy"><p><b>${x.lead}</b></p><h2>ICARE의 관점</h2>${x.body.map(p=>`<p>${p}</p>`).join('')}</div><nav class="related"><a href="journal.html?article=posture">아이의 바른 자세, 언제부터 살펴볼까요? →</a><a href="journal.html?article=golf">골프 스윙을 편안하게 만드는 코어의 힘 →</a><a href="journal.html?article=postpartum">산후 회복, 내 몸의 속도를 찾는 시간 →</a></nav>`;</script></body></html>
