<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>수업 이야기 | 아이케어 필라테스</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      body { margin: 0; background: #19231f; color: #f6f2ea; }
      .history-head { padding: 28px 5vw; display: flex; justify-content: space-between; align-items: center; }
      .history-head > a:last-child { color: inherit; text-decoration: none; font: 12px 'DM Mono'; }
      .history-main { max-width: 1280px; margin: auto; padding: 75px 5vw 130px; }
      .history-main h1 { margin: 0 0 62px; font: 400 clamp(52px, 5vw, 80px)/1.1 Pretendard, sans-serif; letter-spacing: -.045em; }
      .profile { display: grid; grid-template-columns: 1fr 1fr; gap: 8vw; align-items: start; }
      .profile img { width: 100%; height: 650px; object-fit: cover; filter: saturate(.65); }
      .profile-copy h2 { margin: 0 0 25px; font: 400 42px Pretendard, sans-serif; letter-spacing: -.05em; }
      .profile-copy > p { margin-bottom: 58px; font-size: 16px; line-height: 1.9; }
      .timeline { border-top: 1px solid #ffffff44; }
      .timeline div { display: grid; grid-template-columns: 100px 1fr; gap: 20px; padding: 20px 0; border-bottom: 1px solid #ffffff22; }
      .timeline span { font: 12px 'DM Mono'; color: #dce47a; }.timeline b { font-size: 15px; }
      .gallery { display: grid; grid-template-columns: 1.35fr 1fr; gap: 15px; margin-top: 110px; }
      .gallery img { width: 100%; height: 430px; object-fit: cover; }.gallery img:last-child { height: 290px; align-self: end; }
      @media (max-width: 700px) { .history-main { padding-top: 45px; }.history-main h1 { font-size: 42px; margin-bottom: 38px; }.profile { grid-template-columns: 1fr; }.profile img { height: 360px; }.gallery { grid-template-columns: 1fr; margin-top: 48px; }.gallery img,.gallery img:last-child { height: 220px; } }
    </style>
  </head>
  <body>
    <header class="history-head"><a class="logo" href="index.html">I<span>CARE</span><small>KIDS & FAMILY PILATES</small></a><a href="index.html">← 홈으로</a></header>
    <main class="history-main"><p class="eyebrow">DIRECTOR'S STORY</p><h1>아이의 성장을<br>곁에서 살핍니다.</h1><section class="profile"><img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=1100&q=85" alt="필라테스 수업 장면 예시"><div class="profile-copy"><h2>ICARE의 수업 원칙</h2><p>아이마다 몸을 사용하는 방식과 움직임을 익히는 속도는 다릅니다. 먼저 아이의 현재 모습과 관심을 살피고, 그에 맞는 연습을 차분히 이어갑니다.</p><div class="timeline"><div><span>살피기</span><b>성장 시기와 평소의 움직임을 함께 확인합니다.</b></div><div><span>익히기</span><b>정렬과 코어, 균형을 즐거운 동작으로 연습합니다.</b></div><div><span>나누기</span><b>수업에서 발견한 점과 가정에서 이어갈 움직임을 보호자와 나눕니다.</b></div></div></div></section><section class="gallery"><img src="https://images.unsplash.com/photo-1545389336-cf090694435e?auto=format&fit=crop&w=1200&q=85" alt="필라테스 움직임 예시"><img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=900&q=85" alt="몸의 균형을 연습하는 장면 예시"></section></main>
  </body>
</html>
