<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>프로그램 | ICARE Pilates</title><link rel="stylesheet" href="/style.css">
  <style>
    body{margin:0;background:#f3f0eb;color:#19231f}.p-head{padding:28px 5vw;display:flex;align-items:center;justify-content:space-between}.p-head>a:last-child{color:inherit;text-decoration:none;font:12px 'DM Mono'}.hero-p{max-width:1320px;margin:auto;padding:60px 5vw 92px}.hero-p h1{font:400 clamp(54px,6.5vw,92px)/1.04 'Icare Suit',sans-serif;letter-spacing:-.05em;margin:0}.hero-p>p:last-of-type{max-width:520px;margin:30px 0 0;font-size:17px;line-height:1.8}.program-image{width:100%;height:min(520px,52vw);object-fit:cover;margin-top:48px;filter:saturate(.82)}.content{max-width:1200px;margin:auto;padding:100px 5vw;display:grid;grid-template-columns:.85fr 1.15fr;gap:11vw}.content h2{margin:0;font:500 clamp(28px,3vw,40px)/1.25 'Icare Suit',sans-serif;letter-spacing:-.04em}.content p{margin:0;font-size:16px;line-height:1.9}.benefits{margin-top:42px;border-top:1px solid #19231f}.benefits div{display:grid;grid-template-columns:46px 1fr;gap:15px;padding:17px 0;border-bottom:1px solid #19231f2e;font-size:15px}.benefits span{font:11px 'DM Mono';color:#c9795a}.program-gallery{padding:92px 5vw 105px;background:#e8e4dc}.gallery-inner{max-width:1200px;margin:auto}.gallery-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:34px}.gallery-head h2{margin:10px 0 0;font:400 clamp(34px,4vw,58px)/1.05 'DM Serif Display';letter-spacing:-.04em}.gallery-count{font:12px 'DM Mono'}.gallery-stage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.7fr);background:#19231f;color:#fff}.gallery-photo{min-height:470px;overflow:hidden;background:#333}.gallery-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .28s ease}.gallery-copy{padding:46px 40px;display:flex;flex-direction:column}.gallery-copy .caption{margin:0;font:11px 'DM Mono';color:#d9ff41}.gallery-copy blockquote{margin:42px 0 18px;font:400 clamp(23px,2.4vw,34px)/1.35 'Icare Suit',sans-serif;letter-spacing:-.035em}.gallery-copy cite{color:#c7cec9;font-size:13px;font-style:normal;line-height:1.65}.gallery-controls{display:flex;gap:8px;margin-top:auto;padding-top:42px}.gallery-controls button{width:48px;height:48px;border:1px solid #ffffff66;color:#fff;background:transparent;font-size:21px;cursor:pointer;transition:.2s}.gallery-controls button:hover{color:#19231f;background:#d9ff41;border-color:#d9ff41}.gallery-dots{display:flex;gap:7px;align-items:center}.gallery-dots button{width:18px;height:2px;padding:0;border:0;background:#ffffff55;cursor:pointer}.gallery-dots button.active{background:#d9ff41}.cta{display:flex;align-items:center;justify-content:space-between;padding:72px 5vw;background:#19231f;color:#fff}.cta h2{margin:0;font:400 clamp(32px,4vw,58px)/1.12 'Icare Suit',sans-serif;letter-spacing:-.04em}.cta a{display:inline-block;padding:10px 0;border-bottom:1px solid;color:inherit;text-decoration:none;font:12px 'DM Mono'}
    @media(max-width:700px){.hero-p{padding:38px 24px 56px}.hero-p h1{font-size:clamp(38px,11.5vw,50px)}.hero-p>p:last-of-type{margin-top:22px;font-size:15px}.program-image{height:300px;margin-top:32px}.content{display:block;padding:58px 24px}.content p{margin-top:24px;font-size:15px}.program-gallery{padding:58px 24px}.gallery-head{margin-bottom:22px}.gallery-head h2{font-size:34px}.gallery-stage{grid-template-columns:1fr}.gallery-photo{min-height:290px}.gallery-copy{padding:28px 24px 24px}.gallery-copy blockquote{margin:24px 0 14px;font-size:22px}.gallery-controls{padding-top:28px}.cta{display:block;padding:56px 24px}.cta a{margin-top:28px}}
  </style>
</head>
<body>
  <header class="p-head"><a class="logo" href="index.html">I<span>CARE</span><small>KIDS & FAMILY PILATES</small></a><a href="index.html#classes">← PROGRAMS</a></header><main id="program"></main>
  <script>
    const programs={
      kids:{tag:'01 / KIDS PILATES',title:'아이의 몸이\n건강하게 자라는\n움직임.',intro:'성장기에 필요한 정렬과 코어 안정성을 놀이처럼 익히는 1:1 맞춤 필라테스입니다.',img:'https://images.unsplash.com/photo-1599901860904-17e6ed7083a0?auto=format&fit=crop&w=1800&q=88',heading:'성장을 돕는\n움직임의 기초',body:'아이마다 성장 속도와 몸의 사용 습관은 다릅니다. ICARE는 척추의 정렬과 균형·집중력을 함께 길러 일상에서도 편안한 움직임을 만들도록 돕습니다.',benefits:['바른 자세와 척추 정렬','코어 안정성과 균형감각','몸의 인식과 집중력 향상'],gallery:[['https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1500&q=86','BALANCE · 1:1 SESSION','“아이 스스로 자세를 바로잡는 순간이 늘었어요.”','초등 3학년 보호자 · 어린이 필라테스 3개월'],['https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=1500&q=86','CORE · PLAYFUL MOVEMENT','“운동을 기다리는 시간으로 생각해요.”','초등 1학년 보호자 · 어린이 필라테스 2개월'],['https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=1500&q=86','POSTURE · GROWING WELL','“움직임이 훨씬 편안해졌다고 아이가 먼저 말했어요.”','초등 5학년 보호자 · 자세 컨디셔닝']]},
      golf:{tag:'02 / GOLF PILATES',title:'더 편안하고\n단단한\n한 번의 스윙.',intro:'스윙의 회전과 지지력을 분석해, 나만의 움직임 효율을 만드는 골프 컨디셔닝 프로그램입니다.',img:'https://images.unsplash.com/photo-1517130038641-a774d04afb3c?auto=format&fit=crop&w=1800&q=88',heading:'스윙을 위한\n균형의 설계',body:'흉추 회전, 고관절 가동성, 코어의 지지력을 세심하게 다루어 반복되는 부담은 낮추고 스윙의 일관성은 높입니다.',benefits:['회전 가동성과 분리 움직임','코어 지지력과 체중 이동','라운딩 후 피로·통증 관리'],gallery:[['https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=1500&q=86','ROTATION · GOLF CONDITIONING','“허리 부담 없이 회전하는 감각을 처음 알게 됐습니다.”','40대 골퍼 · 골프 필라테스 10회'],['https://images.unsplash.com/photo-1517838277536-f5f99be50106?auto=format&fit=crop&w=1500&q=86','MOBILITY · HIP & THORACIC','“라운딩 다음 날의 피로가 확실히 달라졌어요.”','50대 골퍼 · 움직임 컨디셔닝 3개월'],['https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1500&q=86','STABILITY · CORE SUPPORT','“스윙이 흔들리지 않는 이유를 몸으로 이해했습니다.”','30대 골퍼 · 개인 레슨 병행']]},
      care:{tag:'03 / LIFE CARE',title:'변화하는 몸에\n가장 다정한\n움직임.',intro:'산후 회복부터 통증 관리, 시니어와 임산부 운동까지 삶의 시기에 맞춘 회복 필라테스입니다.',img:'https://images.unsplash.com/photo-1588286840104-8957b019727f?auto=format&fit=crop&w=1800&q=88',heading:'내 몸의 속도를\n되찾는 시간',body:'호흡과 가벼운 움직임부터 시작해 안전하고 꾸준하게 일상의 활력을 되찾도록 함께합니다.',benefits:['산후 회복과 골반저근 케어','통증 완화와 움직임 재교육','임산부·시니어 맞춤 안전 운동'],gallery:[['https://images.unsplash.com/photo-1545389336-cf090694435e?auto=format&fit=crop&w=1500&q=86','RECOVERY · GENTLE START','“조급하지 않게 내 몸의 속도를 찾을 수 있었어요.”','산후 케어 회원 · 회복 필라테스 2개월'],['https://images.unsplash.com/photo-1552196563-55cd4e45efb3?auto=format&fit=crop&w=1500&q=86','BREATH · PAIN MANAGEMENT','“일상에서 느끼던 불편함이 차분히 줄어들었습니다.”','통증 관리 회원 · 개인 수업 12회'],['https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1500&q=86','STRENGTH · LIFE CARE','“무리하지 않아도 몸이 단단해질 수 있다는 걸 알았어요.”','시니어 회원 · 주 2회 수업']]}
    };
    const item=programs[new URLSearchParams(location.search).get('type')]||programs.kids;document.title=`${item.tag} | ICARE Pilates`;
    document.querySelector('#program').innerHTML=`<section class="hero-p"><p class="eyebrow">${item.tag}</p><h1>${item.title.replaceAll('\n','<br>')}</h1><p>${item.intro}</p><img class="program-image" src="${item.img}" alt="${item.tag}"></section><section class="content"><h2>${item.heading.replaceAll('\n','<br>')}</h2><div><p>${item.body}</p><div class="benefits">${item.benefits.map((b,i)=>`<div><span>0${i+1}</span><b>${b}</b></div>`).join('')}</div></div></section><section class="program-gallery"><div class="gallery-inner"><div class="gallery-head"><div><p class="eyebrow">IN THE STUDIO</p><h2>움직임의 기록과<br>솔직한 이야기.</h2></div><p class="gallery-count"><span data-current>01</span> / 0${item.gallery.length}</p></div><div class="gallery-stage"><div class="gallery-photo"><img data-image src="${item.gallery[0][0]}" alt="수업 활동 사진"></div><div class="gallery-copy"><p class="caption" data-caption>${item.gallery[0][1]}</p><blockquote data-quote>${item.gallery[0][2]}</blockquote><cite data-author>${item.gallery[0][3]}</cite><div class="gallery-controls"><button type="button" data-prev aria-label="이전 후기">←</button><div class="gallery-dots">${item.gallery.map((_,i)=>`<button type="button" class="${i?'':'active'}" data-slide="${i}" aria-label="${i+1}번 후기 보기"></button>`).join('')}</div><button type="button" data-next aria-label="다음 후기">→</button></div></div></div></div></section><section class="cta"><h2>나에게 맞는<br>움직임을 만나보세요.</h2><a href="inquiry.html">RESERVE A CONSULTATION →</a></section>`;
    let current=0;const show=index=>{current=(index+item.gallery.length)%item.gallery.length;const slide=item.gallery[current],image=document.querySelector('[data-image]');image.style.opacity='0';setTimeout(()=>{image.src=slide[0];image.style.opacity='1'},150);document.querySelector('[data-caption]').textContent=slide[1];document.querySelector('[data-quote]').textContent=slide[2];document.querySelector('[data-author]').textContent=slide[3];document.querySelector('[data-current]').textContent=String(current+1).padStart(2,'0');document.querySelectorAll('[data-slide]').forEach((dot,i)=>dot.classList.toggle('active',i===current))};document.querySelector('[data-prev]').onclick=()=>show(current-1);document.querySelector('[data-next]').onclick=()=>show(current+1);document.querySelectorAll('[data-slide]').forEach(dot=>dot.onclick=()=>show(Number(dot.dataset.slide)));
  </script>
</body>
</html>
