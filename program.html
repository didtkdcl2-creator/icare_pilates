<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로그램 | ICARE Pilates</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;background:#f3f0eb;color:#19231f}.p-head{padding:28px 5vw;display:flex;justify-content:space-between;align-items:center}.p-head a{color:inherit;text-decoration:none;font:12px 'DM Mono'}.hero-p{padding:60px 5vw 105px;max-width:1320px;margin:auto}.hero-p h1{font:400 clamp(55px,7.5vw,115px)/.9 Pretendard;letter-spacing:-.065em;margin:0}.hero-p p{font-size:17px;line-height:1.8;margin:35px 0 0;max-width:470px}.program-image{width:100%;height:min(550px,58vw);object-fit:cover;margin-top:55px;filter:saturate(.82)}.content{max-width:1200px;margin:auto;padding:110px 5vw;display:grid;grid-template-columns:.85fr 1.15fr;gap:11vw}.content h2{font-size:32px;letter-spacing:-.04em;margin:0}.content p{font-size:16px;line-height:1.9;margin:0}.benefits{margin-top:45px;border-top:1px solid #19231f}.benefits div{display:grid;grid-template-columns:50px 1fr;gap:15px;border-bottom:1px solid #19231f2e;padding:17px 0;font-size:15px}.benefits span{font:11px 'DM Mono';color:#c9795a}.cta{background:#19231f;color:#fff;padding:70px 5vw;display:flex;justify-content:space-between;align-items:center}.cta h2{font:400 clamp(32px,4vw,58px)/1 Pretendard;letter-spacing:-.05em;margin:0}.cta a{color:inherit;text-decoration:none;border-bottom:1px solid;padding:10px 0;font:12px 'DM Mono'}@media(max-width:700px){.hero-p{padding-top:38px}.hero-p h1{font-size:55px;line-height:1}.program-image{height:430px;margin-top:38px}.content{display:block;padding:75px 7vw}.content p{margin-top:28px}.cta{display:block}.cta a{display:inline-block;margin-top:30px}}</style></head><body><header class="p-head"><a class="logo" href="index.html">I<span>CARE</span><small>KIDS & FAMILY PILATES</small></a><a href="index.html#classes">← PROGRAMS</a></header><main id="program"></main><script>const d={kids:{tag:'01 / KIDS PILATES',title:'아이의 몸이\n건강하게 자라는\n움직임.',intro:'성장기에 필요한 정렬과 코어 안정성을 놀이처럼 익히는 1:1 맞춤 필라테스입니다.',img:'https://images.unsplash.com/photo-1599901860904-17e6ed7083a0?auto=format&fit=crop&w=1800&q=88',heading:'성장을 돕는\n움직임의 기초',body:'아이마다 성장 속도와 몸의 사용 습관은 다릅니다. ICARE는 유연성만을 목표로 하지 않고, 척추의 정렬과 균형·집중력을 함께 길러 일상에서도 편안한 움직임을 만들도록 돕습니다.',benefits:['바른 자세와 척추 정렬','코어 안정성과 균형감각','몸의 인식과 집중력 향상']},golf:{tag:'02 / GOLF PILATES',title:'더 편안하고\n단단한\n한 번의 스윙.',intro:'스윙의 회전과 지지력을 분석해, 나만의 움직임 효율을 만드는 골프 컨디셔닝 프로그램입니다.',img:'https://images.unsplash.com/photo-1517130038641-a774d04afb3c?auto=format&fit=crop&w=1800&q=88',heading:'스윙을 위한\n균형의 설계',body:'골프 스윙은 몸의 협응이 만드는 움직임입니다. 흉추 회전, 고관절 가동성, 코어의 지지력을 세심하게 다루어 반복되는 부담은 낮추고 스윙의 일관성은 높입니다.',benefits:['회전 가동성과 분리 움직임','코어 지지력과 체중 이동','라운딩 후 피로·통증 관리']},care:{tag:'03 / LIFE CARE',title:'변화하는 몸에\n가장 다정한\n움직임.',intro:'산후 회복부터 통증 관리, 시니어와 임산부 운동까지 삶의 시기에 맞춘 회복 필라테스입니다.',img:'https://images.unsplash.com/photo-1588286840104-8957b019727f?auto=format&fit=crop&w=1800&q=88',heading:'내 몸의 속도를\n되찾는 시간',body:'회복과 컨디셔닝에는 정답보다 현재 몸의 신호가 중요합니다. 호흡과 가벼운 움직임부터 시작해 안전하고 꾸준하게 일상의 활력을 되찾도록 함께합니다.',benefits:['산후 회복과 골반저근 케어','통증 완화와 움직임 재교육','임산부·시니어 맞춤 안전 운동']}};const x=d[new URLSearchParams(location.search).get('type')]||d.kids;document.title=x.tag+' | ICARE Pilates';document.querySelector('#program').innerHTML=`<section class="hero-p"><p class="eyebrow">${x.tag}</p><h1>${x.title.replaceAll('\n','<br>')}</h1><p>${x.intro}</p><img class="program-image" src="${x.img}" alt="${x.tag}"></section><section class="content"><h2>${x.heading.replaceAll('\n','<br>')}</h2><div><p>${x.body}</p><div class="benefits">${x.benefits.map((b,i)=>`<div><span>0${i+1}</span><b>${b}</b></div>`).join('')}</div></div></section><section class="cta"><h2>나에게 맞는<br>움직임을 만나보세요.</h2><a href="inquiry.html">RESERVE A CONSULTATION →</a></section>`;</script></body></html>
