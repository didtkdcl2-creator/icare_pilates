<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>관리자 | 아이케어 필라테스</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <header class="admin-header">
    <a class="admin-wordmark" href="/"><span aria-hidden="true"></span>I CARE PILATES</a>
    <a class="admin-home" href="/">사이트 보기 <span aria-hidden="true">↗</span></a>
  </header>
  <main id="login-view" class="login-view">
    <h1>관리자 로그인</h1>
    <p>사이트에 공개할 콘텐츠와 상담 채널을 관리합니다.</p>
    <form id="login-form" hidden>
      <label>이메일<input type="email" name="email" autocomplete="username" required maxlength="254"></label>
      <label>비밀번호<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
      <button class="primary" type="submit">로그인</button>
    </form>
    <div id="demo-login" hidden>
      <p>이 기기의 개발 모드에서 공개 콘텐츠 편집을 확인할 수 있습니다.</p>
      <button class="primary" type="button">로컬 미리보기</button>
    </div>
    <p id="login-status" role="status"></p>
  </main>
  <div id="admin-shell" class="admin-layout" hidden>
    <aside>
      <div class="staff"><strong id="staff-name"></strong><span id="staff-role"></span></div>
      <nav aria-label="관리자 메뉴">
        <button type="button" data-view="overview">운영 현황</button>
        <button type="button" data-view="videos">오픈 축하 영상</button>
        <button type="button" data-view="reviews">레슨 후기</button>
        <button type="button" data-view="faq">자주 묻는 질문</button>
        <button type="button" data-view="contact">상담 채널</button>
      </nav>
      <button type="button" id="signout">로그아웃</button>
    </aside>
    <main class="admin-main">
      <div id="admin-panel"></div>
      <p id="admin-status" role="status" tabindex="-1"></p>
    </main>
  </div>
  <dialog id="remove-dialog">
    <form method="dialog">
      <h2 id="remove-title">게시물을 삭제하시겠습니까?</h2>
      <p>삭제하면 사이트에서도 내려갑니다.</p>
      <div class="actions"><button value="cancel" autofocus>취소</button><button class="danger" value="remove">삭제</button></div>
    </form>
  </dialog>
  <script type="module" src="/main.js"></script>
</body>
</html>
